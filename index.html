<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toby Learning Store</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#5e35b1" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
<body>
  <div class="app-shell">
    <!-- 1. CATALOG SCREEN -->
    <div id="catalogScreen" class="screen active">
      <div class="app-bar">
        <h1>Learning Materials</h1>
        <div class="app-bar-actions">
          <button class="icon-btn" onclick="resetCatalog()" title="Reset Default Books">↻</button>
          <button class="btn-add-header" onclick="openAddModal()" title="Add Resource">＋ Add Resource</button>
          <button class="icon-btn" onclick="openCart()" title="Saved Materials">
            🔖
            <span id="cartBadge" class="badge" style="display: none;">0</span>
          </button>
        </div>
      </div>

      <!-- Combined Single Row: All | Cyber Security | AI | Developer | Robotics + Search -->
      <div class="top-filter-row">
        <div class="chips" id="categoryChips"></div>
        <div class="inline-search">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="searchInput"
            placeholder="Search"
            aria-label="Search"
            oninput="renderCatalog()"
          />
        </div>
      </div>

      <!-- Main Workspace: Left Grade/University Tree + Right Materials List -->
      <div class="catalog-workspace">
        <aside class="level-sidebar" id="levelSidebar"></aside>

        <div class="catalog-content">
          <div class="active-filter-bar" id="activeFilterBar"></div>
          <div class="list-area" id="materialsList"></div>
        </div>
      </div>
    </div>

    <!-- 2. DETAIL SCREEN (Book, PDF, Link Reading, 10-Q Quiz Lvl 1-100, Video Amharic/English) -->
    <div id="detailScreen" class="screen">
      <div class="app-bar">
        <div class="app-bar-left">
          <button class="icon-btn" onclick="showScreen('catalogScreen')">←</button>
          <h1 id="detailHeaderTitle">Details</h1>
        </div>
        <div class="app-bar-actions">
          <button class="icon-btn" id="addToCartBtn" title="Save to My List">🔖</button>
          <button class="icon-btn" id="deleteBookBtn" title="Delete Book from Store">🗑️</button>
        </div>
      </div>

      <div class="detail-body">
        <div class="detail-top-card">
          <div class="detail-hero-sm" id="detailIcon">📘</div>
          <div class="detail-meta">
            <div class="detail-title" id="detailTitle"></div>
            <div class="detail-author" id="detailAuthor"></div>
            <div class="pill-row">
              <span class="type-pill" id="detailCategory"></span>
              <span class="type-pill" id="detailLevel"></span>
            </div>
          </div>
        </div>

        <!-- 5 Learning Mode Tabs -->
        <div class="resource-tabs" id="resourceTabs">
          <button class="res-tab active" data-tab="book" onclick="switchResourceTab('book')">📘 Book</button>
          <button class="res-tab" data-tab="pdf" onclick="switchResourceTab('pdf')">📄 PDF</button>
          <button class="res-tab" data-tab="links" onclick="switchResourceTab('links')">🔗 Link Reading</button>
          <button class="res-tab" data-tab="quiz" onclick="switchResourceTab('quiz')">📝 Self-Test (1–100)</button>
          <button class="res-tab" data-tab="video" onclick="switchResourceTab('video')">🎬 Video</button>
        </div>

        <div id="resourceTabContent" class="tab-panel"></div>
      </div>
    </div>

    <!-- 3. SAVED LIST SCREEN -->
    <div id="cartScreen" class="screen">
      <div class="app-bar">
        <div class="app-bar-left">
          <button class="icon-btn" onclick="showScreen('catalogScreen')">←</button>
          <h1>Saved Materials</h1>
        </div>
      </div>

      <div class="list-area" id="cartList"></div>

      <div class="checkout-bar" id="checkoutBar" style="display: none;">
        <button class="btn-primary full-btn" onclick="completeOrder()">
          Access Selected Materials
        </button>
      </div>
    </div>

    <!-- WIZARD MODAL: 1. Select Grade -> 2. Select Type (Book/PDF/Link/Video) -> 3. File vs YouTube/Link -->
    <div id="addBookOverlay" class="dialog-overlay" onclick="closeAddModal(event)">
      <div class="dialog modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3 id="wizardTitle">Add Resource</h3>
          <button type="button" class="close-x" onclick="closeAddModal()">✕</button>
        </div>
        <div id="addWizardBody"></div>
      </div>
    </div>

    <!-- CONFIRMATION DIALOG -->
    <div id="confirmDialog" class="dialog-overlay">
      <div class="dialog">
        <h3>Materials Ready!</h3>
        <p id="confirmMessage"></p>
        <div class="dialog-actions">
          <button class="btn-primary" onclick="finishOrder()">OK</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
