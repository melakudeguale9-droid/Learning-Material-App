<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toby Learning Store</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
  <div class="app-shell">
    <!-- 1. CATALOG SCREEN -->
    <div id="catalogScreen" class="screen active">
      <div class="app-bar">
        <h1>Learning Materials</h1>
        <div class="app-bar-actions">
          <button class="icon-btn" onclick="resetCatalog()" title="Reset Default Books">↻</button>
          <button class="icon-btn" onclick="openAddModal()" title="Add New Book">＋</button>
          <button class="icon-btn" onclick="openCart()" title="Saved Materials">
            🔖
            <span id="cartBadge" class="badge" style="display: none;">0</span>
          </button>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Search books, subjects, authors..."
          oninput="renderCatalog()"
        />
      </div>

      <!-- Top Horizontal Tech Categories: All, Cyber, AI, Developer, Robotics -->
      <div class="chips" id="categoryChips"></div>

      <!-- Main Workspace: Left Grade/University Tree + Right Materials List -->
      <div class="catalog-workspace">
        <aside class="level-sidebar" id="levelSidebar"></aside>

        <div class="catalog-content">
          <div class="active-filter-bar" id="activeFilterBar"></div>
          <div class="list-area" id="materialsList"></div>
        </div>
      </div>
    </div>

    <!-- 2. DETAIL SCREEN -->
    <div id="detailScreen" class="screen">
      <div class="app-bar">
        <div class="app-bar-left">
          <button class="icon-btn" onclick="showScreen('catalogScreen')">←</button>
          <h1 id="detailHeaderTitle">Details</h1>
        </div>
        <button class="icon-btn" id="deleteBookBtn" title="Delete Book from Store">🗑️</button>
      </div>

      <div class="detail-body">
        <div class="detail-hero" id="detailIcon">📘</div>
        <div class="detail-title" id="detailTitle"></div>
        <div class="detail-author" id="detailAuthor"></div>
        <div class="pill-row">
          <span class="type-pill" id="detailCategory"></span>
          <span class="type-pill" id="detailLevel"></span>
          <span class="type-pill" id="detailType"></span>
        </div>

        <div class="divider"></div>
        <div class="desc-heading">Description</div>
        <p class="desc-text" id="detailDesc"></p>

        <div class="detail-footer">
          <button class="btn-primary full-btn" id="addToCartBtn">🔖 Save to My List</button>
        </div>
      </div>
    </div>

    <!-- 3. SAVED LIST SCREEN -->
    <div id="cartScreen" class="screen">
      <div class="app-bar">
        <div class="app-bar-left">
          <button class="icon-btn" onclick="showScreen('catalogScreen')">←</button>
          <h1>Saved Materials</h1>
        </div>
      </div>

      <div class="list-area" id="cartList"></div>

      <div class="checkout-bar" id="checkoutBar" style="display: none;">
        <button class="btn-primary full-btn" onclick="completeOrder()">
          Access Selected Materials
        </button>
      </div>
    </div>

    <!-- ADD NEW BOOK MODAL -->
    <div id="addBookOverlay" class="dialog-overlay" onclick="closeAddModal(event)">
      <div class="dialog modal-card" onclick="event.stopPropagation()">
        <h3>Add Learning Material</h3>
        <form id="addBookForm" onsubmit="addNewBook(event)">
          <div class="form-group">
            <label for="bookTitle">Title</label>
            <input type="text" id="bookTitle" placeholder="e.g. Network Security Fundamentals" required />
          </div>
          <div class="form-group">
            <label for="bookAuthor">Author</label>
            <input type="text" id="bookAuthor" placeholder="e.g. Melaku D." required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="bookCategory">Category</label>
              <select id="bookCategory">
                <option value="Cyber">Cyber</option>
                <option value="AI">AI</option>
                <option value="Developer">Developer</option>
                <option value="Robotics">Robotics</option>
              </select>
            </div>
            <div class="form-group">
              <label for="bookLevel">Grade / Level</label>
              <select id="bookLevel">
                <option value="1 - 4 Grade">1 - 4 Grade</option>
                <option value="5 - 8 Grade">5 - 8 Grade</option>
                <option value="9 - 12 Grade">9 - 12 Grade</option>
                <option value="University|1st Year">University - 1st Year</option>
                <option value="University|2nd Year">University - 2nd Year</option>
                <option value="University|3rd Year">University - 3rd Year</option>
                <option value="University|4th Year">University - 4th Year</option>
                <option value="University|5th Year">University - 5th Year</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="bookType">Format</label>
            <select id="bookType">
              <option value="Physical Book">Physical Book</option>
              <option value="PDF / E-Book">PDF / E-Book</option>
            </select>
          </div>
          <div class="form-group">
            <label for="bookDesc">Description</label>
            <textarea id="bookDesc" rows="2" placeholder="Short summary of the material..." required></textarea>
          </div>
          <div class="dialog-actions">
            <button type="button" class="btn-secondary" onclick="closeAddModal()">Cancel</button>
            <button type="submit" class="btn-primary">Save Book</button>
          </div>
        </form>
      </div>
    </div>

    <!-- CONFIRMATION DIALOG -->
    <div id="confirmDialog" class="dialog-overlay">
      <div class="dialog">
        <h3>Materials Ready!</h3>
        <p id="confirmMessage"></p>
        <div class="dialog-actions">
          <button class="btn-primary" onclick="finishOrder()">OK</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
