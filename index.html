<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toby Learning Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- 1. CATALOG SCREEN -->
    <div id="catalogScreen" class="screen active">
      <div class="app-bar">
        <h1>Learning Materials</h1>
        <div class="app-bar-actions">
          <button class="icon-btn" onclick="openAddModal()" title="Add Material" aria-label="Add Material">＋</button>
          <button class="icon-btn" onclick="openCart()" title="Open Cart" aria-label="Open Cart">
            🛒
            <span id="cartBadge" class="badge" style="display: none;">0</span>
          </button>
        </div>
      </div>

      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Search books, subjects, authors..."
          oninput="renderCatalog()"
        />
      </div>

      <div class="chips" id="categoryChips"></div>
      <div class="list-area" id="materialsList"></div>
    </div>

    <!-- 2. DETAIL SCREEN -->
    <div id="detailScreen" class="screen">
      <div class="app-bar">
        <div class="app-bar-left">
          <button class="icon-btn" onclick="showScreen('catalogScreen')">←</button>
          <h1 id="detailHeaderTitle">Details</h1>
        </div>
      </div>

      <div class="detail-body">
        <div class="detail-hero" id="detailIcon">📘</div>
        <div class="detail-title" id="detailTitle"></div>
        <div class="detail-author" id="detailAuthor"></div>
        <span class="type-pill" id="detailType"></span>

        <div class="divider"></div>
        <div class="desc-heading">Description</div>
        <p class="desc-text" id="detailDesc"></p>

        <div class="detail-footer">
          <div class="detail-price" id="detailPrice"></div>
          <button class="btn-primary" id="addToCartBtn">🛒 Add to Cart</button>
        </div>
      </div>
    </div>

    <!-- 3. CART SCREEN -->
    <div id="cartScreen" class="screen">
      <div class="app-bar">
        <div class="app-bar-left">
          <button class="icon-btn" onclick="showScreen('catalogScreen')">←</button>
          <h1>My Cart</h1>
        </div>
      </div>

      <div class="list-area" id="cartList"></div>

      <div class="checkout-bar" id="checkoutBar" style="display: none;">
        <div class="total-row">
          <span>Total:</span>
          <span style="color: var(--green);" id="cartTotal">0 ETB</span>
        </div>
        <button class="btn-primary full-btn" onclick="openPaymentSheet()">
          Proceed to Payment
        </button>
      </div>
    </div>

    <!-- ADD NEW BOOK MODAL -->
    <div id="addBookOverlay" class="dialog-overlay" onclick="closeAddModal(event)">
      <div class="dialog modal-card" onclick="event.stopPropagation()">
        <h3>Add Learning Material</h3>
        <form id="addBookForm" onsubmit="addNewBook(event)">
          <div class="form-group">
            <label for="bookTitle">Title</label>
            <input type="text" id="bookTitle" placeholder="e.g. Network Security Basics" required />
          </div>
          <div class="form-group">
            <label for="bookAuthor">Author</label>
            <input type="text" id="bookAuthor" placeholder="e.g. Melaku D." required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="bookCategory">Category</label>
              <select id="bookCategory">
                <option value="Science">Science</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Languages">Languages</option>
              </select>
            </div>
            <div class="form-group">
              <label for="bookPrice">Price (ETB)</label>
              <input type="number" id="bookPrice" min="1" placeholder="200" required />
            </div>
          </div>
          <div class="form-group">
            <label for="bookType">Format</label>
            <select id="bookType">
              <option value="Physical Book">Physical Book</option>
              <option value="PDF / E-Book">PDF / E-Book</option>
            </select>
          </div>
          <div class="form-group">
            <label for="bookDesc">Description</label>
            <textarea id="bookDesc" rows="2" placeholder="Short summary of the material..." required></textarea>
          </div>
          <div class="dialog-actions">
            <button type="button" class="btn-secondary" onclick="closeAddModal()">Cancel</button>
            <button type="submit" class="btn-primary">Save Book</button>
          </div>
        </form>
      </div>
    </div>

    <!-- PAYMENT BOTTOM SHEET -->
    <div id="paymentOverlay" class="overlay" onclick="closePaymentSheet(event)">
      <div class="sheet" onclick="event.stopPropagation()">
        <h3>Select Payment Method</h3>
        <div class="pay-option" onclick="completeOrder('Telebirr')">📱 Telebirr</div>
        <div class="pay-option" onclick="completeOrder('CBE Birr')">🏦 CBE Birr</div>
        <div class="pay-option" onclick="completeOrder('Credit / Debit Card')">💳 Credit / Debit Card</div>
        <div class="pay-option" onclick="completeOrder('Cash on Delivery')">🚚 Cash on Delivery (Physical Books)</div>
      </div>
    </div>

    <!-- CONFIRMATION DIALOG -->
    <div id="confirmDialog" class="dialog-overlay">
      <div class="dialog">
        <h3>Order Placed!</h3>
        <p id="confirmMessage"></p>
        <div class="dialog-actions">
          <button class="btn-primary" onclick="finishOrder()">OK</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
